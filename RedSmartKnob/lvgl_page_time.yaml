# LVGL Page definition for time & weather.
# Script references should be primarily in actions_time.yaml

lvgl:
  pages:
    - id: page_time
      on_swipe_right:
        - script.execute: navigate_right_swipe
      on_swipe_left:
        - script.execute: navigate_left_swipe
      on_swipe_up:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - script.execute:
            id: show_media_controls_popup
            direction: "UP"
      on_swipe_down:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - script.execute:
            id: show_media_controls_popup
            direction: "DOWN"
      on_click:
        - script.execute:
            id: show_media_controls_popup
            direction: "UP"
      styles: rsk_page_bg
      widgets:
        - label:
            id: date_widget
            align: TOP_MID
            y: 8%
            long_mode: WRAP
            text_align: CENTER
            text_font: theme_font_large
            text: "<initializing>"

        - label:
            id: time_widget
            long_mode: WRAP
            align: TOP_MID
            y: 20%
            text_letter_space: 0
            text_font: font_7seg
            text: "--:--:--"

        - obj:
            id: temp_status_line
            align: center
            layout:  # horizontal-ish
              type: flex
              flex_flow: row
              flex_align_main: center # space_evenly
              flex_align_track: center
              flex_align_cross: center
            y: -7%
            bg_opa: 0%
            border_width: 0
            height: 10%
            width: 95%
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  id: outdoor_temp_icon
                  text_font: font_icons_large
                  text: "${icon_thermo_outside}"
              - label:
                  id: outdoor_temp_label
                  text_font: theme_font_large
                  text: "–"
              - label:
                  id: indoor_temp_icon
                  text_font: font_icons_large
                  text: "${icon_thermo_inside}"
              - label:
                  id: indoor_temp_label
                  text_font: theme_font_large
                  text: "–"

        # Translucent caption band across the lower third of the circle.
        - obj:
            x: 0%
            y: 67%
            width: 100%
            height: 33%
            radius: 0
            styles: rsk_opacity_bg
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
            widgets:
              - label:
                  id: time_track_artist_label
                  align: TOP_MID
                  width: 90%
                  long_mode: SCROLL_CIRCULAR
                  text_align: CENTER
                  styles: rsk_font_color2
                  text_font: theme_font_normal
                  text: "Unknown Artist"
              - label:
                  id: time_track_name_label
                  align: TOP_MID
                  y: 18%
                  width: 85%
                  long_mode: SCROLL_CIRCULAR
                  text_align: CENTER
                  styles: rsk_font_color
                  text_font: theme_font_large
                  text: "Unknown Track"
              - label:
                  id: time_track_album_label
                  align: TOP_MID
                  y: 46%
                  width: 80%
                  long_mode: SCROLL_CIRCULAR
                  text_align: CENTER
                  styles: rsk_font_color2
                  text_font: theme_font_small
                  text: "Unknown Album"
              - label:
                  id: time_play_pause_indicator_label
                  align: TOP_MID
                  y: 65%
                  x: -15%
                  text_align: CENTER
                  styles: rsk_font_color2
                  text_font: font_icons_small
                  text: "${icon_pause}"
              - label:
                  id: time_track_time_label
                  align: TOP_MID
                  y: 65%
                  text_align: CENTER
                  styles: rsk_font_color2
                  text_font: theme_font_small
                  text: "00:00 / 99:99"

