# LVGL Page definition for media controls.
# Script references should be primarily in actions_media.yaml
# This unit should _not_ reference $mediaplayer.

lvgl:
  pages:
    - id: page_media_controls
      skip: true
      on_swipe_right:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - script.execute: hide_popups
      on_swipe_left:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - script.execute: hide_popups
      on_swipe_up:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - script.execute: hide_popups
      on_swipe_down:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - script.execute: hide_popups
      styles: rsk_page_bg
      widgets:
        - button:
            id: controls_dismiss
            align: top_mid
            y: 10
            width: 10%
            height: 10%
            ext_click_area: 20
            on_single_click:
              - script.execute: hide_popups
            widgets:
              - label:
                  styles: rsk_font_color_on_accent
                  text_font: theme_font_large
                  text: "X"


        # Translucent caption band across the top-middle, below the dismissal.
        - obj:
            x: 0%
            y: 16%
            width: 100%
            height: 28%
            radius: 0
            styles: rsk_opacity_bg
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
            widgets:
              - label:
                  id: controls_track_artist_label
                  align: TOP_MID
                  width: 85%
                  y: 3%
                  styles: rsk_font_color2
                  text_font: theme_font_normal
                  long_mode: SCROLL_CIRCULAR
                  anim_duration: 8s
                  text: "Unknown Artist"
              - label:
                  id: controls_track_name_label
                  align: CENTER
                  y: -10%
                  width: 90%
                  text_font: theme_font_large
                  long_mode: SCROLL_CIRCULAR
                  anim_duration: 8s
                  text: "Unknown Track"
              - label:
                  id: controls_track_album_label
                  align: CENTER
                  y: 15%
                  width: 95%
                  styles: rsk_font_color2
                  text_font: theme_font_small
                  long_mode: SCROLL_CIRCULAR
                  anim_duration: 8s
                  text: "Unknown Album"
              - label:
                  id: controls_play_pause_indicator_label
                  align: BOTTOM_MID
                  y: -5%
                  x: -15%
                  text_align: CENTER
                  styles: rsk_font_color2
                  text_font: font_icons_small
                  text: "${icon_pause}"
              - label:
                  id: controls_track_time_label
                  align: BOTTOM_MID
                  y: -5%
                  text_align: CENTER
                  styles: rsk_font_color2
                  text_font: theme_font_small
                  text: "00:00 / 99:99"

        - obj:
            align: CENTER
            width: 90%
            height: 20%
            y: 5%
            bg_opa: TRANSP
            border_opa: TRANSP
            layout: horizontal
            pad_all: ${ui_padding}
            gesture_bubble: true
            widgets:
              - button:
                  id: controls_previous
                  on_single_click:
                    - script.execute: set_media_previous
                  widgets:
                    - label:
                        styles: rsk_font_color_on_accent
                        text: ${icon_previous}
                        text_font: font_icons_button
              - button:
                  id: controls_toggle_button
                  on_single_click:
                    - script.execute: set_media_play_pause
                    - script.execute: hide_popups
                  widgets:
                    - label:
                        styles: rsk_font_color_on_accent
                        text: ${icon_play_pause}
                        text_font: font_icons_button
              - button:
                  id: controls_next
                  on_single_click:
                    - script.execute: set_media_next
                  widgets:
                    - label:
                        styles: rsk_font_color_on_accent
                        text: ${icon_next}
                        text_font: font_icons_button

        # Volume control
        - slider:
            id: volume_control_widget
            align: CENTER
            y: 25%
            width: 60%
            height: 4%
            gesture_bubble: true
            # on_value causes a loop when the value is updated from e.g. sendspin.
            # on_release only does it on user release.
            on_release:
              - lvgl.widget.update:
                  id: volume_control_widget
                  state:
                    user_1: !lambda 'return x > 80;'
              - script.execute:
                  id: set_media_volume
                  new_vol: !lambda 'return x / 100.0;'

        # Volume percentage display
        - label:
            id: volume_text
            align: CENTER
            y: 32%
            text_font: theme_font_normal
            text: "XX%"

